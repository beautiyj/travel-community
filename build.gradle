// tour 도메인과 관광공사 API 배치를 빌드에서 제외 (개발 진행중이라 컴파일이 통과하지 않음)
// batch/payment(결제 정합성 보정)는 reservation의 ReservationExpireScheduler가 참조하므로 반드시 포함한다.
// tour 배치 하위 패키지가 서로를 참조해서 일부만 빼면 "package does not exist"가 나므로 payment를 뺀 batch 전체를 제외한다.
// TODO: 개발완료되면 해당 코드 전체 삭제
sourceSets {
	main {
		java {
			exclude 'com/gnagnoohc/travel/tour/**'
			exclude 'com/gnagnoohc/travel/batch/client/**'
			exclude 'com/gnagnoohc/travel/batch/controller/**'
			exclude 'com/gnagnoohc/travel/batch/converter/**'
			exclude 'com/gnagnoohc/travel/batch/dto/**'
			exclude 'com/gnagnoohc/travel/batch/helper/**'
			exclude 'com/gnagnoohc/travel/batch/scheduler/**'
			exclude 'com/gnagnoohc/travel/batch/service/**'
		}
		resources {
			exclude 'mapper/tour/**'
		}
	}
}

repositories {
	mavenCentral()
	maven { url 'https://jitpack.io' } // Komoran (형태소분석기, 후기 감성분석용)
}

dependencies {
	// webClient
    implementation 'org.springframework.boot:spring-boot-starter-webflux'

	// JSP
    implementation 'org.apache.tomcat.embed:tomcat-embed-jasper'
    implementation 'jakarta.servlet:jakarta.servlet-api'
    implementation 'jakarta.servlet.jsp.jstl:jakarta.servlet.jsp.jstl-api'
    implementation 'org.glassfish.web:jakarta.servlet.jsp.jstl:3.0.0'
	providedRuntime 'org.springframework.boot:spring-boot-starter-tomcat'

	// Security
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	implementation 'org.springframework.boot:spring-boot-starter-security'

	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	// implementation 'org.jsoup:jsoup:1.18.1'

	implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.5'
	runtimeOnly 'com.mysql:mysql-connector-j'

	// 후기 감성분석 : 형태소분석기 (명사/용언 추출)
	implementation 'com.github.shin285:KOMORAN:3.3.9'

	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	annotationProcessor 'org.projectlombok:lombok'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:3.0.5'
    testImplementation 'org.springframework.security:spring-security-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
	
	// Email
	implementation 'org.springframework.boot:spring-boot-starter-mail'
}

tasks.named('test') {
	useJUnitPlatform()
}
