// yun - tour/batch 관련 도메인만 포함하고 나머지 빌드 제외 (로컬 개인 테스트용)
// TODO: 개발완료되면 해당 코드 전체 삭제
sourceSets {
    main {
        java {
            // 메인 애플리케이션 클래스(TravelApplication.java)와 batch, tour 패키지만 컴파일 대상에 포함
            include 'com/gnagnoohc/travel/TravelApplication.java'
            include 'com/gnagnoohc/travel/batch/**'
            include 'com/gnagnoohc/travel/tour/**'
        }
        resources {
            // tour 관련 매퍼 XML 및 기본 설정 파일 포함
            include 'mapper/tour/**'
            include 'application.yml'
            include 'application.properties'
            include 'static/**'
            include 'templates/**'
        }
    }
}

repositories {
	mavenCentral()
	maven { url 'https://jitpack.io' } // Komoran (형태소분석기, 후기 감성분석용)
}

dependencies {
	// webClient
    implementation 'org.springframework.boot:spring-boot-starter-webflux'

	// JSP
    implementation 'org.apache.tomcat.embed:tomcat-embed-jasper'
    implementation 'jakarta.servlet:jakarta.servlet-api'
    implementation 'jakarta.servlet.jsp.jstl:jakarta.servlet.jsp.jstl-api'
    implementation 'org.glassfish.web:jakarta.servlet.jsp.jstl:3.0.0'
	providedRuntime 'org.springframework.boot:spring-boot-starter-tomcat'

	// Security
	// implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	implementation 'org.springframework.boot:spring-boot-starter-security'

	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	// implementation 'org.jsoup:jsoup:1.18.1'

	implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.5'
	runtimeOnly 'com.mysql:mysql-connector-j'

	// 후기 감성분석 : 형태소분석기 (명사/용언 추출)
	implementation 'com.github.shin285:KOMORAN:3.3.9'

	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	annotationProcessor 'org.projectlombok:lombok'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:3.0.5'
    // testImplementation 'org.springframework.security:spring-security-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
	
	// Email
	implementation 'org.springframework.boot:spring-boot-starter-mail'
}

tasks.named('test') {
	useJUnitPlatform()
}
