# 키/비밀번호는 application-secret.properties에 분리 (gitignore 대상)
spring.profiles.include=secret

spring.application.name=travel
# server.port=80
server.port=9999

spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

mybatis.type-aliases-package=com.gnagnoohc.travel
mybatis.mapper-locations=classpath:/mapper/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# Venue photo upload (yun)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# ---------- 이미지 저장소 (도메인 공용) ----------
# local(기본) / cloudinary. 배포에서는 아래 두 값을 환경변수로 넣으면 코드 수정 없이 전환된다.
#   APP_STORAGE_TYPE=cloudinary
#   CLOUDINARY_URL=cloudinary://{api_key}:{api_secret}@{cloud_name}
# 로컬에서 켜고 끄는 스위치는 application-secret.properties의 app.storage.type 한 줄이다.

# 도메인별 bucket. 새 도메인은 아래 네 줄만 복사해서 이름을 바꾸면 자바 코드는 손대지 않아도 된다.
#   dir/url-prefix     : type=local 일 때 저장 폴더와 서빙 URL 접두사
#   cloudinary-folder  : type=cloudinary 일 때 업로드될 폴더
#   max-size           : 업로드 용량 상한 (0이면 멀티파트 설정에만 의존)
#   serve-local        : 로컬 서빙 핸들러를 공용 설정이 자동 등록할지
#                        (WebMvcConfig가 이미 /uploads/place를 서빙 중이라 false)
app.storage.buckets.place.dir=${file.upload-dir}
app.storage.buckets.place.url-prefix=/uploads/place
app.storage.buckets.place.cloudinary-folder=travel/place
app.storage.buckets.place.max-size=5MB
app.storage.buckets.place.serve-local=false

# ---------- 서버 주소 (카카오 콜백 URL 생성용, 포트 9999) ----------
app.base-url=http://localhost:9999

# 공공데이터 테스트용 조회 - 데이터 개수 numOfRows /페이징 pageNo
tour.api.batch-size=500
tour.api.default-page=1