# \uD0A4/\uBE44\uBC00\uBC88\uD638\uB294 application-secret.properties\uC5D0 \uBD84\uB9AC (gitignore \uB300\uC0C1)
spring.profiles.include=secret

spring.application.name=travel
# server.port=80
server.port=9999

spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

mybatis.type-aliases-package=com.gnagnoohc.travel
mybatis.mapper-locations=classpath:/mapper/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# ---------- \uC774\uBBF8\uC9C0 \uC800\uC7A5\uC18C (\uB3C4\uBA54\uC778 \uACF5\uC6A9, Cloudinary \uC804\uC6A9) ----------
# \uBC30\uD3EC\uC5D0\uC11C \uB123\uC5B4\uC57C \uD558\uB294 \uAC12: CLOUDINARY_URL=cloudinary://{api_key}:{api_secret}@{cloud_name}
# \uB85C\uCEEC\uC740 application-secret.properties\uC758 cloudinary.url \uD55C \uC904\uC774\uB2E4.

# \uB3C4\uBA54\uC778\uBCC4 bucket. \uC0C8 \uB3C4\uBA54\uC778\uC740 \uC544\uB798 \uB450\uC138 \uC904\uB9CC \uBCF5\uC0AC\uD574\uC11C \uC774\uB984\uC744 \uBC14\uAFB8\uBA74 \uC790\uBC14 \uCF54\uB4DC\uB294 \uC190\uB300\uC9C0 \uC54A\uC544\uB3C4 \uB41C\uB2E4.
#   cloudinary-folder  : \uC5C5\uB85C\uB4DC\uB420 Cloudinary \uD3F4\uB354
#   max-size           : \uC5C5\uB85C\uB4DC \uC6A9\uB7C9 \uC0C1\uD55C (0\uC774\uBA74 \uBA40\uD2F0\uD30C\uD2B8 \uC124\uC815\uC5D0\uB9CC \uC758\uC874)
#   allowed-extensions : \uAE30\uBCF8\uAC12 jpg,jpeg,png,gif,webp
app.storage.buckets.place.cloudinary-folder=travel/place
app.storage.buckets.place.max-size=5MB

app.storage.buckets.business-document.cloudinary-folder=travel/business-document
app.storage.buckets.business-document.max-size=5MB
app.storage.buckets.business-document.allowed-extensions=jpg,jpeg,png

app.storage.buckets.community.cloudinary-folder=travel/community
app.storage.buckets.community.max-size=5MB

app.storage.buckets.profile.cloudinary-folder=travel/profile
app.storage.buckets.profile.max-size=5MB
app.storage.buckets.profile.allowed-extensions=jpg,jpeg,png,webp

app.storage.buckets.place-media.cloudinary-folder=travel/mypage-place
app.storage.buckets.place-media.max-size=5MB
app.storage.buckets.place-media.allowed-extensions=jpg,jpeg,png,webp

# ---------- \uC11C\uBC84 \uC8FC\uC18C (\uCE74\uCE74\uC624 \uCF5C\uBC31 URL \uC0DD\uC131\uC6A9, \uD3EC\uD2B8 9999) ----------
app.base-url=http://localhost:9999

# \uACF5\uACF5\uB370\uC774\uD130 \uD14C\uC2A4\uD2B8\uC6A9 \uC870\uD68C - \uB370\uC774\uD130 \uAC1C\uC218 numOfRows /\uD398\uC774\uC9D5 pageNo
tour.api.batch-size=500
tour.api.default-page=1