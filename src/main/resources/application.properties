# 키/비밀번호는 application-secret.properties에 분리 (gitignore 대상)
spring.profiles.include=secret

spring.application.name=travel
# server.port=80
server.port=9999

spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

mybatis.type-aliases-package=com.gnagnoohc.travel
mybatis.mapper-locations=classpath:/mapper/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# Venue photo upload (yun)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# ---------- 이미지 저장소 (도메인 공용, Cloudinary 전용) ----------
# 배포에서 넣어야 하는 값: CLOUDINARY_URL=cloudinary://{api_key}:{api_secret}@{cloud_name}
# 로컬은 application-secret.properties의 cloudinary.url 한 줄이다.

# 도메인별 bucket. 새 도메인은 아래 두세 줄만 복사해서 이름을 바꾸면 자바 코드는 손대지 않아도 된다.
#   cloudinary-folder  : 업로드될 Cloudinary 폴더
#   max-size           : 업로드 용량 상한 (0이면 멀티파트 설정에만 의존)
#   allowed-extensions : 기본값 jpg,jpeg,png,gif,webp
app.storage.buckets.place.cloudinary-folder=travel/place
app.storage.buckets.place.max-size=5MB

app.storage.buckets.business-document.cloudinary-folder=travel/business-document
app.storage.buckets.business-document.max-size=5MB
app.storage.buckets.business-document.allowed-extensions=jpg,jpeg,png

app.storage.buckets.community.cloudinary-folder=travel/community
app.storage.buckets.community.max-size=5MB

app.storage.buckets.profile.cloudinary-folder=travel/profile
app.storage.buckets.profile.max-size=5MB
app.storage.buckets.profile.allowed-extensions=jpg,jpeg,png,webp

app.storage.buckets.place-media.cloudinary-folder=travel/mypage-place
app.storage.buckets.place-media.max-size=5MB
app.storage.buckets.place-media.allowed-extensions=jpg,jpeg,png,webp

# ---------- 서버 주소 (카카오 콜백 URL 생성용, 포트 9999) ----------
app.base-url=http://localhost:9999

# 공공데이터 테스트용 조회 - 데이터 개수 numOfRows /페이징 pageNo
tour.api.batch-size=500
tour.api.default-page=1